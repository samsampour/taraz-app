<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src blob:; object-src blob:; worker-src 'self'; base-uri 'self'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./logo.svg" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>ورود</title>
</head>
<body style="margin:0;background:#fff;font-family:system-ui,Tahoma,sans-serif">
<form id="gate" hidden style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:0 24px">
<div style="width:100%;max-width:18rem">
<label style="display:block;margin-bottom:12px"><span style="display:block;font-size:12px;color:#78716c;margin-bottom:4px">نام کاربری</span>
<input name="u" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" style="box-sizing:border-box;width:100%;height:44px;border:1px solid #d6d3d1;border-radius:8px;padding:0 12px;font-size:16px" /></label>
<label style="display:block;margin-bottom:12px"><span style="display:block;font-size:12px;color:#78716c;margin-bottom:4px">رمز</span>
<input name="p" type="password" dir="ltr" autocomplete="current-password" style="box-sizing:border-box;width:100%;height:44px;border:1px solid #d6d3d1;border-radius:8px;padding:0 12px;font-size:16px" /></label>
<p id="err" hidden style="color:#b91c1c;font-size:12px;margin:0 0 12px">نام کاربری یا رمز درست نیست.</p>
<button style="width:100%;height:44px;border:0;border-radius:8px;background:#1c1917;color:#fff;font-size:14px;font-weight:600;font-family:inherit">ورود</button>
</div>
</form>
<div id="root"></div>
<script src="./boot.js"></script>
</body>
</html>
